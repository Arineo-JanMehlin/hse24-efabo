                Fill: =varHSEBranding.HSEOrange
                FocusedBorderThickness: =0
                HoverFill: =ColorFade(varHSEBranding.HSEOrange, -20%)
                OnSelect: |-
                    =UpdateContext({varCommentFrom: "ITSec"});
                    UpdateContext({NextStatus: "Kommentar"});
                    UpdateContext({NewComment: true});
                    //Neu 30.06.2023 wegen Problem bei Formular bleibt offen nach Kommentar verschicken, Flow schickt Mail und User erstellt direkt neuen Kommentar und Felder werden nicht aktualisiert
                    //SubmitForm(ViewForm)
                    UpdateContext(
                        {
                            cvarCommentFrom: Filter(
                                Choices('EFABO Anträge'.'Kommentar von'),
                                Value in LookUp(
                                    'EFABO Anträge',
                                    ID = AntragsID
                                ).'Kommentar von'.Value || Value = varCommentFrom,
                                Value <> "Kein neuer Kommentar"
                            )
                        }
                    );
                    UpdateContext(
                        {
                            cvarCommentITSecOld: LookUp(
                                'EFABO Anträge',
                                ID = AntragsID
                            ).'Kommentar IT Security'
                        }
                    );
                    UpdateContext(
                        {
                            cvarCommentITSec: If(
                        // Abfrage, ob überhaupt ein neuer Kommentar verfasst wurde, nur dann neuer Eintrag
                                !IsBlank(dcv_KommentarITSecNew.Text),
                                If(
                            // Abfrage, ob es einen Kommentar zuvor überhaupt gab, wenn ja den alten Eintrag mit übernehmen
                                    !IsBlank(cvarCommentITSecOld),
                                    Concatenate(
                                        cvarCommentITSecOld,
                                        Char(10),
                                        Text(
                                            Now(),
                                            "dd.mm.yyyy"
                                        ),
                                        " ",
                                        User().FullName,
                                        ": ",
                                        dcv_KommentarITSecNew.Text
                                    ),
                                    Concatenate(
                                        Text(
                                            Now(),
                                            "dd.mm.yyyy"
                                        ),
                                        " ",
                                        User().FullName,
                                        ": ",
                                        dcv_KommentarITSecNew.Text
                                    )
                                ),
                                cvarCommentITSecOld
                            )
                        }
                    );
                    Patch(
                        'EFABO Anträge',
                        LookUp(
                            'EFABO Anträge',
                            ID = AntragsID
                        ),
                        {
                            'Neuer Kommentar': true,
                            'Kommentar von': cvarCommentFrom,
                            'Kommentar IT Security': cvarCommentITSec
                        },ViewForm_Attachments.Updates
                    );
                    Notify(
                        LookUp(
                            colRessource,
                            Title = "lbl_Gespeichert" && Sprache.Value = varSelectedCulture,
                            Text
                        ),
                        NotificationType.Success,
                        3000
                    );
                    Set(
                        KFTyp,
                        ""
                    );
                    Set(
                        KFArt,
                        ""
                    );
                    Navigate(
                        SuccessScreen,
                        ScreenTransition.None,
                        {NextStatus: NextStatus}
                    );
                    //Ende neu
                RadiusBottomLeft: =0
                RadiusBottomRight: =0
