    AF_Form As form:
        AcceptsFocus: =false
        DataSource: ='Arbeitsrechtliche Freigabe'
        DefaultMode: |
            =Switch(varFormStatus,"New",FormMode.New,FormMode.Edit)
        Height: =633
        Item: |-
            =//If(!IsBlank(EfaboAntrag),LookUp('Arbeitsrechtliche Freigabe',FK_EFABO=Text(EfaboAntrag.ID)),Blank())
            //If(!IsBlank(varAFID),LookUp('Arbeitsrechtliche Freigabe',ID=varAFID),Blank())
            LookUp('Arbeitsrechtliche Freigabe',Title=Text(EfaboAntrag.ID))
        NumberOfColumns: =2
        OnFailure: |-
            =//varStatus zurücksetzen wegen Entwurf
            Set(varStatus,Blank());
        OnSuccess: |-
            =//Noch einbauen - Notify nicht wenn varFormStatus = "New"
            If(
                EfaboAntrag.Status.Value = "Entwurf" || NewForm.LastSubmit.Status.Value = "Entwurf",
                UpdateContext({NextStatus: "Entwurf"}),
                If(
                    varFormStatus = "New",
                    If(
                            // Wenn Ersteller = Verantwortlicher = Genehmiger -> anderen Success Text abfragen
            // die eigentliche Logik wird im Workflow EFABO - Neuer Antrag abgefangen
                        NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Verantwortlicher Mitarbeiter'.Email && NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Erstellt von'.Email,
                        UpdateContext({NextStatus: "In Prüfung"}),
                        UpdateContext({NextStatus: "Prüfung Genehmiger"})
                    )
                )
            );
            Set(
                glNextStatus,
                NextStatus
            );
            Notify(
                LookUp(
                    colRessource,
                    Title = "lbl_Gespeichert" && Sprache.Value = varSelectedCulture,
                    Text
                ) & NextStatus,
                NotificationType.Success,
                3000
            );
            If(
                NextStatus <> "Kommentar LegalAP" && varUpdateFrom = "AF_Form",
                Navigate(
                    SuccessScreen,
                    ScreenTransition.None,
                    {NextStatus: NextStatus}
                )
            );
            //ResetForm(AF_Form)
        Width: =1366
        Y: =135
        ZIndex: =8

