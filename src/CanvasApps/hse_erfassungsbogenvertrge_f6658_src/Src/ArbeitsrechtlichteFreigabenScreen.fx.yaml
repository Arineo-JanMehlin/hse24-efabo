            Default: =ThisItem.Kommentar_Legal
            DisplayMode: =Parent.DisplayMode
            DisplayName: =LookUp(colRessource,Title = "q_Kommentar_Legal" && Sprache.Value = varSelectedCulture,Text) 
            Fill: =RGBA(0, 0, 0, 0)
            Height: =If(dtc_KommentarLegalNew.Visible,210,100)
            MaxLength: =DataSourceInfo([@'Arbeitsrechtliche Freigabe'], DataSourceInfo.MaxLength, Kommentar_Legal)
            Required: |-
                =//varRejectApprovalReAF||varBackToRequestorReAF
                Self.Visible && If(
                    (varRolleUser = "Prüfende Rechtsanwälte" || varRolleUser = "Sachbearbeiter Recht") && (EfaboAntrag.PruefungArbeitsrechtlicheFragen = "In Prüfung" || EfaboAntrag.Status.Value = "Verlängerung beantragt"),
                    If(EfaboAntrag.Status.Value = "Verlängerung beantragt" && !varRejectApprovalReAF,false,true),
                    false
                )
            Update: |-
                =If(
                    // Abfrage, ob überhaupt ein neuer Kommentar verfasst wurde, nur dann neuer Eintrag
                    !IsBlank(dtc_KommentarLegalNew.Text),
                    If(
                        // Abfrage, ob es einen Kommentar zuvor überhaupt gab, wenn ja den alten Eintrag mit übernehmen
                        !IsBlank(dtc_KommentarLegal.Text),
                        Concatenate(
                            dtc_KommentarLegal.Text,
                            Char(10),
                            Text(
                                Now(),
                                "dd.mm.yyyy"
                            ),
                            " ",
                            User().FullName,
                            ": ",
                            dtc_KommentarLegalNew.Text
                        ),
                        Concatenate(
                            Text(
                                Now(),
                                "dd.mm.yyyy"
                            ),
                            " ",
                            User().FullName,
                            ": ",
