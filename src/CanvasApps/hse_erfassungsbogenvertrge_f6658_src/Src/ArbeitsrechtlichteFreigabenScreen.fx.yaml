                                                ": ",
                                                "Arbeitsrechtliche Prüfung zum EFABO hinzugefügt."
                                            )
                                        }
                                    ),
                                    UpdateContext(
                                        {
                                            commentEFABOPostCreation: Concatenate(
                                                Text(
                                                    Now(),
                                                    "dd.mm.yyyy"
                                                ),
                                                " ",
                                                User().FullName,
                                                ": ",
                                                "Arbeitsrechtliche Prüfung zum EFABO hinzugefügt."
                                            )
                                        }
                                    )
                                );
