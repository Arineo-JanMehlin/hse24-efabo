    Button1_13 As button:
        BorderThickness: =0
        Color: =varHSEBranding.White
        Fill: =varHSEBranding.HSEOrange
        FocusedBorderThickness: =0
        HoverFill: =ColorFade(varHSEBranding.HSEOrange, -20%)
        OnSelect: |-
            =UpdateContext({cvarAntragsteller: false});
            UpdateContext({cvarGenehmiger: false});
            UpdateContext({cvarSachbearbeiterRecht: false});
            UpdateContext({cvarPruefendeRechtsanwaelte: false});
            UpdateContext({cvarSachbearbeiterFinanzen: false});
            UpdateContext({cvarEinkauf: false});
            // Abfrage welches Formular angezeigt werden soll
            If(
                // Überprüfung, ob eine ID übergeben wurde
                IsBlankOrError(TextInput2_1.Text),
                // Weiterleitung auf die New Form, wenn keine ID übergeben wurde
                Navigate(NewEFABOScreen),
                Set(
                    AntragsID,
                    Value(TextInput2_1.Text)
                );
                Set(
                    EfaboAntrag,
                    LookUp(
                        'EFABO Anträge',
                        ID = AntragsID
                    )
                );
                //Abfrage welche Rolle der User hat
            Clear(colUserRollen);
                Set(
                    varAntragsteller,
                    false
                );
                Set(
                    varGenehmiger,
                    false
                );
                Set(
                    varSachbearbeiterRecht,
                    false
                );
                Set(
                    varPruefendeRechtsanwaelte,
                    false
                );
                Set(
                    varSachbearbeiterFinanzen,
                    false
                );
                Set(
                    varEinkauf,
                    false
                );
                Concurrent(
                    If(
                        Lower(EfaboAntrag.'Verantwortlicher Mitarbeiter'.Email) = User().Email,
                        Set(
                            varAntragsteller,
                            true
                        )
                    ),
                    If(
                        User().Email = Lower(EfaboAntrag.'Genehmiger (gem. Orga-Unterschriften)'.Email) Or User().Email = "desvc.efabo@hse.com",
                        Set(
                            varGenehmiger,
                            true
                        )
                    ),
                    If(
                        CheckifuserinSharePointGroup.Run(
                            User().Email,
                            "Sachbearbeiter Recht"
                        ).groupmember = "True",
                        Set(
                            varSachbearbeiterRecht,
                            true
                        )
                    ),
                    If(
                        CheckifuserinSharePointGroup.Run(
                            User().Email,
                            "Prüfende Rechtsanwälte"
                        ).groupmember = "True",
                        Set(
                            varPruefendeRechtsanwaelte,
                            true
                        )
                    ),
                    If(
                        CheckifuserinSharePointGroup.Run(
                            User().Email,
                            "Sachbearbeiter Finanzen"
                        ).groupmember = "True",
                        Set(
                            varSachbearbeiterFinanzen,
                            true
                        )
                    ),
                    If(
                        CheckifuserinSharePointGroup.Run(
                            User().Email,
                            "Einkauf"
                        ).groupmember = "True",
                        Set(
                            varEinkauf,
                            true
                        )
                    )
                );
                If(
                    varAntragsteller,
                    Collect(
                        colUserRollen,
                        {Value: "Antragssteller"}
                    )
                );
                If(
                    varGenehmiger,
                    Collect(
                        colUserRollen,
                        {Value: "Genehmiger"}
                    )
                );
                If(
                    varSachbearbeiterFinanzen,
                    Collect(
                        colUserRollen,
                        {Value: "Sachbearbeiter Finanzen"}
                    )
                );
                If(
                    varEinkauf,
                    Collect(
                        colUserRollen,
                        {Value: "Einkauf"}
                    )
                );
                If(
                    varPruefendeRechtsanwaelte,
                    Collect(
                        colUserRollen,
                        {Value: "Sachbearbeiter Recht"}
                    );
                    Collect(
                        colUserRollen,
                        {Value: "Prüfende Rechtsanwälte"}
                    ),
                    If(
                        varSachbearbeiterFinanzen,
                        Collect(
                            colUserRollen,
                            {Value: "Sachbearbeiter Recht"}
                        )
                    )
                );
                If(
                    CountRows(colUserRollen) = 1,
                    Set(
                        varRolleUser,
                        First(colUserRollen).Value
                    );
                    If(
                        varRolleUser = "Antragssteller" && EfaboAntrag.Status.Value <> "Abgelehnt" && EfaboAntrag.Status.Value <> "Zurückgezogen" && EfaboAntrag.Status.Value <> "Abgeschlossen" && EfaboAntrag.Status.Value <> "Verlängerung beantragt",
                        Navigate(EditEFABOScreen),
                        Navigate(ViewEFABOScreen)
                    )
                );
                If(
                    CountRows(colUserRollen) > 1,
                    // Wenn es genau 2 Rollen sind, abfragen ob Legal und Sachbearbeiter Legal oder ob Genehmiger und Antragsteller
                    If(
                        CountRows(colUserRollen) = 2,
                        If(
                            "Prüfende Rechtsanwälte" in colUserRollen.Value && "Sachbearbeiter Recht" in colUserRollen.Value,
                            If(
                                EfaboAntrag.'Prüfung Legal' = "Anlage Akte in Lecare",
                                Set(
                                    varRolleUser,
                                    "Sachbearbeiter Recht"
                                );
                                Navigate(ViewEFABOScreen),
                                Set(
                                    varRolleUser,
                                    "Prüfende Rechtsanwälte"
                                );
                                Navigate(ViewEFABOScreen)
                            ),
                            If(
                                "Antragssteller" in colUserRollen.Value && "Genehmiger" in colUserRollen.Value,
                                If(
                                    EfaboAntrag.Status.Value <> "Abgelehnt" && EfaboAntrag.Status.Value <> "Zurückgezogen" && EfaboAntrag.Status.Value <> "Abgeschlossen",
                                    Navigate(EditEFABOScreen),
                                    Navigate(ViewEFABOScreen)
                                ),
                                Navigate(StartScreen)
                            )
                        ),
                        // Default geh zur Rollenauswahl
                        Navigate(StartScreen)
                    )
                )
            )
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
