        AntragstellerITSInteraktionDataCard As typedDataCard.blankCard:
            BorderStyle: =BorderStyle.Solid
            DisplayMode: =DisplayMode.Edit
            Fill: =RGBA(0, 0, 0, 0)
            Height: =60
            Visible: =varRolleUser = "Antragssteller" && EfaboAntrag.Status.Value <> "Abgelehnt" && EfaboAntrag.Status.Value <> "Abgeschlossen" 
            Width: =1366
            X: =0
            Y: =46
            ZIndex: =1

            btn_AbsendenNew_ITS As button:
                BorderThickness: =0
                Color: =varHSEBranding.White
                Fill: =varHSEBranding.HSEOrange
                FocusedBorderThickness: =0
                HoverFill: =ColorFade(varHSEBranding.HSEOrange, -20%)
                OnSelect: |-
                    =//Wurden die Angaben bestätigt und wurden alle Pflichtfelder ausgefüllt?
                    If(
                        ITS_Form.Valid,
                        //Ja, EFABO abschicken
                        If(
                            //Handelt es sich um einen neuen Antrag?
                            varFormStatus = "New",
                             //Ja ITSec neu, check ob EFABO an sich aber schon existiert hat
                            If(
                                IsBlankOrError(EfaboAntrag.ID),
                                // Nein, daher erstmal Submit EFABO NewForm und kein Kommentar
                                SubmitForm(NewForm);
                                Set(
                                varUpdateFrom,
                                "ITS_Form"
                                );
                                Set(
                                    EfaboAntrag,
                                    NewForm.LastSubmit
                                ),
                                // Ja, dann Submit EFABO EditForm und Kommentar versenden, dass neue Prüfung dazu
                                Set(
                                    varUpdateFrom,
                                    "ITS_Form"
                                );
                                SubmitForm(EditForm);
                                Patch(
                                    'EFABO Anträge',
                                    LookUp(
                                        'EFABO Anträge',
                                        ID = AntragsID
                                    ),
                                    EditForm_Attachment.Updates
                                );
                                UpdateContext(
                                    {
                                        commentVonAntragsteller: Filter(
                                            Choices([@'EFABO Anträge'].'Kommentar von'),
                                            Value in EfaboAntrag.'Kommentar von'.Value || Value = "Antragsteller",
                                            Value <> "Kein neuer Kommentar"
                                        )
                                    }
                                );
                                UpdateContext(
                                    {
                                        commentAnLegal: Filter(
                                            Choices([@'EFABO Anträge'].'Kommentar an'),
                                            Value in EfaboAntrag.'Kommentar an'.Value || Value = "IT Security"
                                        )
                                    }
                                );
                                If(
                                    (IsBlankOrError(
                                        LookUp(
                                            'Arbeitsrechtliche Freigabe',
                                            Title = Text(EfaboAntrag.ID)
                                        )
                                    ) && (!dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value)),
                                    UpdateContext(
                                        {
                                            commentAnLegal: Filter(
                                                Choices([@'EFABO Anträge'].'Kommentar an'),
                                                Value in EfaboAntrag.'Kommentar an'.Value || Value = "IT Security" || Value = "Legal"
                                            )
                                        }
                                    )
                                );
                                If(
                                    // Abfrage, ob es einen Kommentar zuvor überhaupt gab, wenn ja den alten Eintrag mit übernehmen
                                    !IsBlank(EfaboAntrag.Kommentar),
                                    UpdateContext(
                                        {
                                            commentEFABOPostCreation: Concatenate(
                                                EfaboAntrag.Kommentar,
                                                Char(10),
                                                Text(
                                                    Now(),
                                                    "dd.mm.yyyy"
                                                ),
                                                " ",
                                                User().FullName,
                                                ": ",
                                                If(
                                                    (IsBlankOrError(
                                                        LookUp(
                                                            'Arbeitsrechtliche Freigabe',
                                                            Title = Text(EfaboAntrag.ID)
                                                        )
                                                    ) && (!dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value)),
                                                    "IT Security & Arbeitsrechtliche Prüfung zum EFABO hinzugefügt.",
                                                    "IT Security Prüfung zum EFABO hinzugefügt."
                                                )
                                            )
                                        }
                                    ),
                                    UpdateContext(
                                        {
                                            commentEFABOPostCreation: Concatenate(
                                                Text(
                                                    Now(),
                                                    "dd.mm.yyyy"
                                                ),
                                                " ",
                                                User().FullName,
                                                ": ",
                                                If(
                                                    (IsBlankOrError(
                                                        LookUp(
                                                            'Arbeitsrechtliche Freigabe',
                                                            Title = Text(EfaboAntrag.ID)
                                                        )
                                                    ) && (!dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value)),
                                                    "IT Security & Arbeitsrechtliche Prüfung zum EFABO hinzugefügt.",
                                                    "IT Security Prüfung zum EFABO hinzugefügt."
                                                )
                                            )
                                        }
                                    )
                                );
                                If(
                                    (IsBlankOrError(
                                        LookUp(
                                            'Arbeitsrechtliche Freigabe',
                                            Title = Text(EfaboAntrag.ID)
                                        )
                                    ) && (!dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value)),
                                    Patch(
                                        'EFABO Anträge',
                                        EfaboAntrag,
                                        {
                                            'Neuer Kommentar': true,
                                            'Kommentar von': commentVonAntragsteller,
                                            'Kommentar an': commentAnLegal,
                                            Kommentar: commentEFABOPostCreation,
                                            'Prüfung ITSec': "In Prüfung",
                                            PruefungArbeitsrechtlicheFragen: "In Prüfung"
                                        }
                                    ),
                                    Patch(
                                        'EFABO Anträge',
                                        EfaboAntrag,
                                        {
                                            'Neuer Kommentar': true,
                                            'Kommentar von': commentVonAntragsteller,
                                            'Kommentar an': commentAnLegal,
                                            Kommentar: commentEFABOPostCreation,
                                            'Prüfung ITSec': "In Prüfung"
                                        }
                                    )
                                )
                            );
                            UpdateContext({NextStatus: "In Prüfung"}),
                            //Nein, Editform abschicken und Flow für Berechtigungen starten
                            Set(
                                varUpdateFrom,
                                "ITS_Form"
                            );
                            SubmitForm(EditForm);
                            Patch(
                                'EFABO Anträge',
                                LookUp(
                                    'EFABO Anträge',
                                    ID = AntragsID
                                ),
                                EditForm_Attachment.Updates
                            );
                            '[Parent]EFABOEntwurfzuPrüfung'.Run(EfaboAntrag.ID)
                        );
                        Switch(
                            varFormStatus,
                            "New",
                            If(
                                !IsBlankOrError(EfaboAntrag.ID),
                                If(
                                    !dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value,
                                    SubmitForm(AF_Form)
                                ),
                                If(
                                    !dcv_GeneralFreigabe.Value && !dcv_Whitelist.Value && dcv_AufwVerg.Value,
                                    SubmitForm(AF_Form)
                                )
                            ),
                            "Edit",
                            If(
                                !dcv_GeneralFreigabe_2.Value && !dcv_Whitelist_2.Value && dcv_AufwVerg_2.Value,
                                SubmitForm(AF_Form)
                            )
                        ),
                        //Form ist nicht valid, also zu fehlenden Eingaben benachrichtigen
                        Notify(
                            If(
                                varSelectedCulture = "DE",
                                "Bitte bestätigen Sie, dass Sie die obigen Fragen vollständig und richtig beantwortet haben.",
                                "Please confirm that you have answered the above questions completely and correctly."
                            ),
                            NotificationType.Error,
                            5000
                        )
                    );
