    EditForm As form:
        AcceptsFocus: =false
        DataSource: ='EFABO Anträge'
        Height: =If((!dcv_GeneralFreigabe_2.Value&&!dcv_Whitelist_2.Value&&dcv_AufwVerg_2.Value)||dcv_Einsatz_Software_Edit.Value,632,632+40)
        Item: =EfaboAntrag
        NumberOfColumns: =2
        OnFailure: |-
            =Notify(
                If(
                    varSelectedCulture = "DE",
                    "Bitte überprüfen Sie, ob alle Pflichtangaben des EFABO-Antrag ausgefüllt wurden.",
                    "Please verify that all mandatory information on the EFABO application has been completed."
                ),
                NotificationType.Error,
                5000
            )
        OnSuccess: |-
            =Notify(
                LookUp(
                    colRessource,
                    Title = "lbl_Gespeichert" && Sprache.Value = varSelectedCulture,
                    Text
                ),
                NotificationType.Success,
                3000
            );
            If(
                varUpdateFrom = "EditForm",
                Navigate(
                    SuccessScreen,
                    ScreenTransition.None,
                    {NextStatus: NextStatus}
                )
            );
            Set(
                KFTyp,
                ""
            );
            Set(
                KFArt,
                ""
            )
        Width: =1366
        Y: =135
        ZIndex: =5

