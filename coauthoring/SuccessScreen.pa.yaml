Screens:
  SuccessScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =If(
            IsBlankOrError(NextStatus),
            UpdateContext({NextStatus: glNextStatus})
        );
        ResetForm(NewForm);
        ResetForm(AF_Form);
        ResetForm(ViewForm);
        ResetForm(EditForm);
        UpdateContext({varCommentFrom: "Kein neuer Kommentar"});
        UpdateContext({NewComment: false});
