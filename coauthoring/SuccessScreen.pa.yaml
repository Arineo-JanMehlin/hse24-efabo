      - btn_NeuenVertragErfassen:
          Control: Classic/Button
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =varHSEBranding.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =varHSEBranding.HSEOrange
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(varHSEBranding.HSEOrange, -20%)
            OnSelect: |-
              =Navigate(NewForm);
              ResetForm(NewForm);
              Set(varFormStatus,"New");
              Set(
                  EfaboAntrag,
                  Blank()
              );
              Set(
                  AngebotVorhanden,
                  true
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: '=LookUp(colRessource,Title = "btn_NeuenVertragErfassen" && Sprache.Value = varSelectedCulture,Text) '
            Visible: =varRolleUser = "Antragssteller" || varRolleUser = "Genehmiger"
            Width: =328
            X: =641
            Y: =696
      - btn_ZuMeinenAnträgen:
          Control: Classic/Button
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderThickness: =0
            Color: =varHSEBranding.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =varHSEBranding.HSEOrange
            FocusedBorderThickness: =0
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(varHSEBranding.HSEOrange, -20%)
            OnSelect: |-
              =//App in Dev Umgebung?
              If(
                  Last(
                      ForAll(Split(
                          Param("appId"),
                          "/"
                      ), {Result: ThisRecord.Value})
                  ).Result = "82f0abdb-6e73-46b5-a033-2611cea27ef9",
                  //Ja, gehe in Dev SharePoint Seite
                  Switch(
                      varRolleUser,
                      "Sachbearbeiter Finanzen",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO_DEV/Lists/EFABO%20Antrge/AllItems.aspx?viewid=fcc07569%2D41bd%2D4ff1%2D8f4c%2D9b3a2c8e795d"),
                      "Einkauf",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO_DEV/Lists/EFABO%20Antrge/AllItems.aspx?viewid=2b484092%2D1465%2D4e5d%2D92de%2De189bb52dd40"),
                      "Prüfende Rechtsanwälte",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO_DEV/Lists/EFABO%20Antrge/AllItems.aspx?viewid=177c464c%2D2fcd%2D4d3b%2D8fbb%2Db7351a4f1875"),
                      "Sachbearbeiter Recht",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO_DEV/Lists/EFABO%20Antrge/AllItems.aspx?viewid=744d5a68%2D856b%2D4da8%2Da650%2Df121d0fdbf59"),
                  // Defaultverhalten für Antragsteller und Genehmiger
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO_DEV")
                  ),
              //Nein, gehe in Prod SharePoint Seite
                  Switch(
                      varRolleUser,
                      "Sachbearbeiter Finanzen",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO/Lists/EFABO%20Antrge/Prfung%20durch%20Finanzen.aspx"),
                      "Einkauf",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO/Lists/EFABO%20Antrge/Prfung%20durch%20Indirect%20Sourcing.aspx"),
                      "Prüfende Rechtsanwälte",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO/Lists/EFABO%20Antrge/Prfung%20durch%20Legal.aspx"),
                      "Sachbearbeiter Recht",
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO/Lists/EFABO%20Antrge/Anlage%20Akte%20in%20Lecare.aspx"),
                  // Defaultverhalten für Antragsteller und Genehmiger
                      Launch("https://homeshoppingeurope24.sharepoint.com/sites/EFABO")
                  )
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Text: '=LookUp(colRessource,Title = "btn_ZuMeinenAnträgen" && Sprache.Value = varSelectedCulture,Text) '
            Width: =298
            X: =1018
            Y: =696
      - lbl_GenehmigungErfolgreich:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            Height: =154
            Text: |-
              =If(
                  !IsBlankOrError(NewForm.LastSubmit.ID),
                  If(
                      IsBlank(
                          LookUp(
                              'EFABO Anträge',
                              ID = NewForm.LastSubmit.ID
                          ).'Prüfung ITSec'
                      ) && varUpdateFrom <> "ITS_Form",
                      LookUp(
                          colRessource,
                          Title = "lbl_GenehmigungErfolgreich" && Sprache.Value = varSelectedCulture,
                          Text
                      ),
                      LookUp(
                          colRessource,
                          Title = "lbl_GenehmigungErfolgreich_MitITSecurity" && Sprache.Value = varSelectedCulture,
                          Text
                      )
                  ),
                  If(
                      IsBlank(
                          LookUp(
                              'EFABO Anträge',
                              ID = EfaboAntrag.ID
                          ).'Prüfung ITSec'
                      ) && varUpdateFrom <> "ITS_Form",
                      LookUp(
                          colRessource,
                          Title = "lbl_GenehmigungErfolgreich" && Sprache.Value = varSelectedCulture,
                          Text
                      ),
                      LookUp(
                          colRessource,
                          Title = "lbl_GenehmigungErfolgreich_MitITSecurity" && Sprache.Value = varSelectedCulture,
                          Text
                      )
                  )
              )
            VerticalAlign: =VerticalAlign.Top
            Visible: =NextStatus = "In Prüfung"
            Width: =665
            X: =429
            Y: =405
