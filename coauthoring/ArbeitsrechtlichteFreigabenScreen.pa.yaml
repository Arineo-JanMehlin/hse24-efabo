Screens:
  ArbeitsrechtlichteFreigabenScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =Set(
            varBackToRequestorReAF,
            false
        );
        Set(
            varRejectApprovalReAF,
            false
        );
        UpdateContext(
            {
                varDraftStatus: Blank(),
                varAFID: Value(Param("AFID"))
            }
        );
        /* ID-Logik:
        Set(
                EfaboAntrag,
                LookUp(
                    'EFABO Anträge',
                    ID = Value(TextInput2_1.Text)
                )
            )
        */
        //Reset der User-Bestätigung, wenn Formular in Edit Mode
        If(
            AF_Form.Mode = 0,
            UpdateContext({varReset: true});
            UpdateContext({varReset: false})
        );
        If(
            (EfaboAntrag.Status.Value = "Abgeschlossen" || EfaboAntrag.Status.Value = "Verlängerung beantragt" || EfaboAntrag.Status.Value = "Verlängerung abgelehnt" || EfaboAntrag.Status.Value = "Verlängert") && !IsBlank(
                LookUp(
                    'Arbeitsrechtliche Freigabe',
                    Title = Text(EfaboAntrag.ID)
                ).Ende_der_Leistungserbringung_Neu
            ),
            UpdateContext({cvarAPRenew: true}),
            UpdateContext({cvarAPRenew: false})
        );
    Children:
      - Logo_Image_3:
          Control: Image
          Group: Header_Group_3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =87
            Image: =HSE_logo_S_P_RGB
            ImagePosition: =ImagePosition.Fill
            OnSelect: =
            Width: =177
            X: =1189
      - Header_Label_3:
          Control: Label
          Group: Header_Group_3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =61
            Size: =22
            Text: =LookUp(colRessource,Title = "Header_Label" && Sprache.Value = varSelectedCulture,Text)
            Width: =569
            X: =30
            Y: =14
      - Highlight_Rectangle_3:
          Control: Rectangle
          Group: Header_Group_3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =varHSEBranding.HSEOrange
            Height: =12
            Width: =230
            X: =30
            Y: =75
      - Seperation_Rectangle_3:
          Control: Rectangle
          Group: Header_Group_3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =varHSEBranding.LightGray
            Height: =8
            Width: =1366
            Y: =87
      - AF_Form:
          Control: Form
          Variant: Classic
          Layout: Horizontal
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: ='Arbeitsrechtliche Freigabe'
            DefaultMode: |+
              =Switch(varFormStatus,"New",FormMode.New,FormMode.Edit)
            Height: =633
            Item: |-
              =//If(!IsBlank(EfaboAntrag),LookUp('Arbeitsrechtliche Freigabe',FK_EFABO=Text(EfaboAntrag.ID)),Blank())
              //If(!IsBlank(varAFID),LookUp('Arbeitsrechtliche Freigabe',ID=varAFID),Blank())
              LookUp('Arbeitsrechtliche Freigabe',Title=Text(EfaboAntrag.ID))
            NumberOfColumns: =2
            OnFailure: |-
              =//varStatus zurücksetzen wegen Entwurf
              Set(varStatus,Blank());
              Notify(
                  "Die Arbeitsrechtliche Freigabe konnte nicht gespeichert werden: " & AF_Form.Error,
                  NotificationType.Error,
                  8000
              )
            OnSuccess: |-
              =//Noch einbauen - Notify nicht wenn varFormStatus = "New"
              If(
                  EfaboAntrag.Status.Value = "Entwurf" || NewForm.LastSubmit.Status.Value = "Entwurf",
                  UpdateContext({NextStatus: "Entwurf"}),
                  If(
                      varFormStatus = "New",
                      If(
                              // Wenn Ersteller = Verantwortlicher = Genehmiger -> anderen Success Text abfragen
              // die eigentliche Logik wird im Workflow EFABO - Neuer Antrag abgefangen
                          NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Verantwortlicher Mitarbeiter'.Email && NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Erstellt von'.Email,
                          UpdateContext({NextStatus: "In Prüfung"}),
                          UpdateContext({NextStatus: "Prüfung Genehmiger"})
                      )
                  )
              );
              Set(
                  glNextStatus,
                  NextStatus
              );
              Notify(
                  LookUp(
                      colRessource,
                      Title = "lbl_Gespeichert" && Sprache.Value = varSelectedCulture,
                      Text
                  ) & NextStatus,
                  NotificationType.Success,
                  3000
              );
              If(
                  NextStatus <> "Kommentar LegalAP" && varUpdateFrom = "AF_Form",
                  Navigate(
                      SuccessScreen,
                      ScreenTransition.None,
                      {NextStatus: NextStatus}
                  )
              );
              //ResetForm(AF_Form)
            Width: =1366
            Y: =135
          Children:
            - ArbeitsrechtlPruefungHeader:
                Control: TypedDataCard
