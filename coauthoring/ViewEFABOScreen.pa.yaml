                                      Value <> "Kein neuer Kommentar"
                                  )
                              }
                          );
                          UpdateContext(
                              {
                                  cvarCommentGenehmigerOld: LookUp(
                                      'EFABO Anträge',
                                      ID = AntragsID
                                  ).'Kommentar Genehmiger'
                              }
