Screens:
  NewEFABOScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =Set(
            varSubmitID,
            If(
                !IsBlank(NewForm.LastSubmit.ID),
                Blank()
            )
        );
    Children:
      - Logo_Image:
          Control: Image
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =87
            Image: =HSE_logo_S_P_RGB
            ImagePosition: =ImagePosition.Fill
            OnSelect: =
            Width: =177
            X: =1189
      - Header_Label:
          Control: Label
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =61
            Size: =22
            Text: '=LookUp(colRessource,Title = "Header_Label" && Sprache.Value = varSelectedCulture,Text) '
            Width: =529
            X: =30
            Y: =14
      - Highlight_Rectangle:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =varHSEBranding.HSEOrange
            Height: =12
            Width: =230
            X: =30
            Y: =75
      - Seperation_Rectangle:
          Control: Rectangle
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =varHSEBranding.LightGray
            Height: =8
            Width: =1366
            Y: =87
      - NewForm:
          Control: Form
          Variant: Classic
          Layout: Horizontal
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: ='EFABO Anträge'
            DefaultMode: =FormMode.New
            Height: =If(!dcv_GeneralFreigabe.Value&&!dcv_Whitelist.Value&&dcv_AufwVerg.Value,632,632+40)
            NumberOfColumns: =2
            OnFailure: |-
              =/*
              Notify(
                  "Error: " & NewForm.Error;
                  NotificationType.Error;
                  3000
              );;
              */
              Set(
                  varStatus,
                  Blank()
              );
              Notify(
                  If(
                      varSelectedCulture = "DE",
                      "Bitte überprüfen Sie, ob alle Pflichtangaben des EFABO-Antrag ausgefüllt wurden.",
                      "Please verify that all mandatory information on the EFABO application has been completed."
                  ),
                  NotificationType.Error,
                  5000
              )
            OnSuccess: |-
              =Notify(
                  LookUp(
                      colRessource,
                      Title = "lbl_Gespeichert" && Sprache.Value = varSelectedCulture,
                      Text
                  ),
                  NotificationType.Success,
                  3000
              );
              Set(
                  KFTyp,
                  ""
              );
              Set(
                  KFArt,
                  ""
              );
              //varStatus nach erfolgreichen Submit eines Entwurfs zurücksetzen
              If(
                  NewForm.LastSubmit.Status.Value = "Entwurf",
                  Set(
                      varStatus,
                      Blank()
                  )
              );
              If(
                  !(!NewForm.LastSubmit.Generalfreigabe &&!NewForm.LastSubmit.Whitelist&&NewForm.LastSubmit.'Aufwandsbezogene Verguetung')||NewForm.LastSubmit.'Einsatz Software',
                  Navigate(
                      SuccessScreen,
                      ScreenTransition.None,
                      If(
                          NewForm.LastSubmit.Status.Value = "Entwurf",
                          {NextStatus: "Entwurf"},
                          If(
                      // Wenn Ersteller = Verantwortlicher = Genehmiger -> anderen Success Text abfragen
                      // die eigentliche Logik wird im Workflow EFABO - Neuer Antrag abgefangen
                              NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Verantwortlicher Mitarbeiter'.Email && NewForm.LastSubmit.'Genehmiger (gem. Orga-Unterschriften)'.Email = NewForm.LastSubmit.'Erstellt von'.Email,
                              {NextStatus: "In Prüfung"},
                              {NextStatus: "Prüfung Genehmiger"}
                          )
                      )
                  )
              );
              //ResetForm(NewForm)
            Width: =1366
            Y: =135
