Screens:
  ITSecurityFreigabenScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |
        =Set(
            varBackToRequestorReAF,
            false
        );
        Set(
            varRejectApprovalReAF,
            false
        );
        UpdateContext(
            {
                varDraftStatus: Blank(),
                varAFID: Value(Param("AFID"))
            }
        );
        /* ID-Logik:
        Set(
                EfaboAntrag,
                LookUp(
                    'EFABO Anträge',
                    ID = Value(TextInput2_1.Text)
                )
            )
        */
        //Reset der User-Bestätigung, wenn Formular in Edit Mode
        If(
            AF_Form.Mode = 0,
            UpdateContext({varReset: true});
            UpdateContext({varReset: false})
        );
        If(
            (EfaboAntrag.Status.Value = "Abgeschlossen" || EfaboAntrag.Status.Value = "Verlängerung beantragt" || EfaboAntrag.Status.Value = "Verlängerung abgelehnt" || EfaboAntrag.Status.Value = "Verlängert") && !IsBlank(
                LookUp(
                    'Arbeitsrechtliche Freigabe',
                    Title = Text(EfaboAntrag.ID)
                ).Ende_der_Leistungserbringung_Neu
            ),
            UpdateContext({cvarAPRenew: true}),
            UpdateContext({cvarAPRenew: false})
        );
